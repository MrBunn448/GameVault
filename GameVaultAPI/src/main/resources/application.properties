spring.application.name=GameVaultAPI

# Database configuration (MySQL in Docker)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gamevault}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:gamevault}
spring.datasource.password=${DB_PASSWORD:gamevaultpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates tables based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Steam Web API configuration
# Reads key from local environment variable
steam.api.key=${STEAM_API_KEY:}
steam.api.base-url=https://api.steampowered.com
