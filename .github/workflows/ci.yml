name: Backend CI/CD

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GameVaultAPI

    steps:
      # Pull down git repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java JDK 25 environment
      - name: Set up Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Make sure gradlew has run permissions
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Static code analysis (Teacher Requirement: Sonar & Checkstyle)
      - name: Run static code analysis (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      # Compile code, run all JUnit unit and integration test suites, and generate JaCoCo coverage
      - name: Build with Gradle and run tests
        run: ./gradlew build jacocoTestReport --no-daemon

      # Static code analysis with Sonar (Teacher Requirement)
      - name: Sonar Static Code Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --no-daemon

      # Log in to GitHub Container Registry (Industry Standard Option B)
      - name: Log in to GitHub Container Registry
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image (Build Once principle: built & tested in CI, deployed to CD)
      - name: Build and push Docker image to GHCR
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}/gamevault-backend:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Continuous Deployment (Educloud Production)
    needs: build
    runs-on: self-hosted
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Pre-built Backend & MySQL with Docker
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}/gamevault-backend:latest"

          # Pull pre-built image verified in CI (No compilation on production runner)
          docker pull "$IMAGE"

          # Populate .env file with secrets from GitHub Actions Secrets
          cat <<EOF > .env
          STEAM_API_KEY=${STEAM_API_KEY}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
          MYSQL_DATABASE=gamevault
          DB_NAME=gamevault
          EOF

          # Ensure MySQL container is active
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d db
          else
            docker-compose up -d db
          fi

          # Restart backend container using pre-built image
          docker stop gamevault-backend 2>/dev/null || true
          docker rm gamevault-backend 2>/dev/null || true

          DB_NET=$(docker inspect gamevault-mysql --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}}{{end}}' 2>/dev/null || echo "bridge")
          docker run -d \
            --name gamevault-backend \
            --restart always \
            --network "$DB_NET" \
            -p 8080:8080 \
            -e DB_HOST=gamevault-mysql \
            -e DB_PORT=3306 \
            -e DB_NAME=gamevault \
            -e DB_USER="${DB_USER}" \
            -e DB_PASSWORD="${DB_PASSWORD}" \
            -e STEAM_API_KEY="${STEAM_API_KEY}" \
            "$IMAGE"
          docker ps
