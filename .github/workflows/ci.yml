name: GameVault Backend Continuous Integration

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
      - 'devops/**'
      - 'test/**'
  pull_request:
    branches:
      - main

# Prevent duplicate concurrently running builds on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Backend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: GameVaultAPI

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java JDK 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle with automatic dependency caching
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: GameVaultAPI
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Execute automated tests (Unit & MockMvc Integration)
        run: ./gradlew clean test --no-daemon

      - name: Verify production JAR packaging
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload JUnit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: GameVaultAPI/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  docker-build-check:
    name: Verify Docker Container Build
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v6
        with:
          context: GameVaultAPI
          file: GameVaultAPI/Dockerfile
          push: false
          tags: gamevault-api:ci-test
