name: Backend CI/CD

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GameVaultAPI

    steps:
      # Pull down git repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java JDK 25 environment
      - name: Set up Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Make sure gradlew has run permissions
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Static code analysis (Teacher Requirement: Sonar & Checkstyle)
      - name: Run static code analysis (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      # Compile code, run all JUnit unit and integration test suites, and generate JaCoCo coverage
      - name: Build with Gradle and run tests
        run: ./gradlew build jacocoTestReport --no-daemon

      # Static code analysis with Sonar (Teacher Requirement)
      - name: Sonar Static Code Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --no-daemon

  deploy:
    name: Continuous Deployment (Educloud)
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Backend & MySQL with Docker Compose
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          if [ -n "${STEAM_API_KEY}" ]; then
            echo "STEAM_API_KEY=${STEAM_API_KEY}" > .env
          fi
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build
            docker compose ps
          else
            docker-compose up -d --build
            docker-compose ps
          fi
