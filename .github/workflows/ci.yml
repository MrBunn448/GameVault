name: Backend CI/CD

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GameVaultAPI

    steps:
      # Pull down git repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java JDK 25 environment
      - name: Set up Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Make sure gradlew has run permissions
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Static code analysis (Teacher Requirement: Back-end static code analysis)
      - name: Run static code analysis (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      # Compile code and run all JUnit test suites
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

  deploy:
    name: Continuous Deployment (Educloud)
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Backend & MySQL with Docker Compose
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build
            docker compose ps
          else
            docker-compose up -d --build
            docker-compose ps
          fi
